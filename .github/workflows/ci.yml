name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6bf36eb2f06db5cfee754b34f0fd3a0783f0dcb5 # v0.6.178
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 15
      hosted-runner: ubuntu-24.04
      uv-version: 0.13.9
      python-version: 3.14.10
