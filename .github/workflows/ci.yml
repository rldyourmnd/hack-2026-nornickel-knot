name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@9f400b71c978c8c3974863f4dd25331d3d1be79d # v0.6.176
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 15
      hosted-runner: ubuntu-24.04
      uv-version: 0.13.9
      python-version: 3.14.10
