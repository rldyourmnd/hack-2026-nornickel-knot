name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6d2cdfdf3edba130dada52a8046b8a8e9f089204 # v0.6.97
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 15
      hosted-runner: ubuntu-24.04
      uv-version: 0.13.9
      python-version: 3.14.10
