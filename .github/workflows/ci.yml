name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c8385cf3321931b9e9f76820c720ec00d344c057 # v0.6.173
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 15
      hosted-runner: ubuntu-24.04
      uv-version: 0.13.9
      python-version: 3.14.10
