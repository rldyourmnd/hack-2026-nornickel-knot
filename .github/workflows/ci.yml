name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@534b2785b49d5d36d074902aa9eefcb5786d898a # v0.6.83
    permissions:
      contents: read
    with:
      setup: true
      timeout-minutes: 15
      hosted-runner: ubuntu-24.04
      uv-version: 0.13.9
      python-version: 3.13.18
